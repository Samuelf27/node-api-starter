services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      # Gere segredos fortes (≥ 32 chars) antes de subir em produção:
      #   openssl rand -hex 32
      # A API falha ao iniciar com estes placeholders — substitua-os.
      JWT_ACCESS_SECRET: CHANGE_ME
      JWT_REFRESH_SECRET: CHANGE_ME
      # Para o caminho com Prisma/PostgreSQL, descomente:
      # DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
